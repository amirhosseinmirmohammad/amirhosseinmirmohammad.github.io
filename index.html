  <style>
    :root {
      --grad: linear-gradient(135deg, #6366f1, #a855f7 50%, #ec4899);
    }
    [data-theme="dark"] {
      --bg: #0b0f1a;
      --card: rgba(255, 255, 255, .055);
      --card-border: rgba(255, 255, 255, .09);
      --text: #eef2ff;
      --muted: #98a2b8;
      --btn-ghost: rgba(255, 255, 255, .07);
      --btn-ghost-hover: rgba(255, 255, 255, .13);
      --line: rgba(255, 255, 255, .07);
      --shadow: 0 24px 60px rgba(0, 0, 0, .5);
    }
    [data-theme="light"] {
      --bg: #eef1f8;
      --card: rgba(255, 255, 255, .75);
      --card-border: rgba(255, 255, 255, .9);
      --text: #14192b;
      --muted: #5b6478;
      --btn-ghost: rgba(20, 25, 43, .06);
      --btn-ghost-hover: rgba(20, 25, 43, .12);
      --line: rgba(20, 25, 43, .08);
      --shadow: 0 24px 60px rgba(99, 102, 241, .18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      font-family: "Vazirmatn", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      transition: background .35s, color .35s;
    }

    /* حباب‌های پس‌زمینه */
    .orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; filter: blur(90px); opacity: .5; }
    .orbs span { position: absolute; border-radius: 50%; }
    .orbs span:nth-child(1) { width: 340px; height: 340px; background: #6366f1; top: -80px; inset-inline-start: -80px; animation: float 14s ease-in-out infinite; }
    .orbs span:nth-child(2) { width: 280px; height: 280px; background: #a855f7; bottom: -60px; inset-inline-end: -60px; animation: float 18s ease-in-out infinite reverse; }
    .orbs span:nth-child(3) { width: 200px; height: 200px; background: #ec4899; top: 45%; inset-inline-start: 55%; animation: float 22s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-36px) scale(1.08); } }

    /* دکمه‌های گوشه بالا */
    .top-bar {
      position: fixed; top: 16px; inset-inline-end: 16px; z-index: 5;
      display: flex; gap: 8px;
    }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--card-border);
      background: var(--card); color: var(--text); cursor: pointer;
      display: grid; place-items: center; backdrop-filter: blur(14px);
      transition: transform .2s, background .2s;
    }
    .icon-btn:hover { transform: translateY(-2px); background: var(--btn-ghost-hover); }
    .icon-btn svg { width: 19px; height: 19px; }
    .lang-btn { font-family: inherit; font-size: 14px; font-weight: 700; width: auto; padding: 0 14px; }

    /* کارت اصلی */
    .card {
      position: relative; z-index: 1;
      width: min(430px, 100%);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 34px 26px 26px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      text-align: center;
      animation: rise .7s cubic-bezier(.2, .9, .3, 1.2) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.97); } }

    /* آواتار با حلقه گرادیانی */
    .avatar-wrap { position: relative; display: inline-block; margin-bottom: 18px; }
    .pulse {
      position: absolute; inset: -6px; border-radius: 50%;
      border: 2px solid rgba(139, 92, 246, .55);
      animation: pulse 2.6s ease-out infinite;
    }
    .pulse.p2 { animation-delay: 1.3s; }
    @keyframes pulse { 0% { transform: scale(.92); opacity: .9; } 100% { transform: scale(1.45); opacity: 0; } }
    .avatar {
      position: relative; width: 118px; height: 118px; border-radius: 50%;
      padding: 4px; background: var(--grad);
    }
    .avatar img, .initials {
      width: 100%; height: 100%; border-radius: 50%;
      object-fit: cover; display: block; border: 4px solid var(--bg);
    }
    .initials {
      display: none; align-items: center; justify-content: center;
      background: var(--grad); color: #fff; font-size: 40px; font-weight: 800; border: none;
    }
    .initials.show { display: flex; }
    .nfc-badge {
      position: absolute; bottom: 2px; inset-inline-end: 2px;
      background: var(--grad); color: #fff;
      font-size: 10px; font-weight: 800; letter-spacing: .5px;
      padding: 4px 8px; border-radius: 999px;
      border: 3px solid var(--bg);
    }

    h1 { font-size: 24px; font-weight: 800; }
    .title { color: #a78bfa; font-size: 14.5px; font-weight: 600; margin-top: 5px; }
    .bio { color: var(--muted); font-size: 13.5px; line-height: 2; margin: 14px auto 6px; max-width: 330px; }
    .location { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .location svg { width: 14px; height: 14px; }

    /* دکمه‌های اکشن */
    .actions { display: flex; gap: 10px; margin: 20px 0 8px; }
    .btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 10px; border-radius: 16px; border: none; cursor: pointer;
      font-family: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none;
      transition: transform .2s, filter .2s, background .2s;
    }
    .btn:active { transform: scale(.96); }
    .btn svg { width: 17px; height: 17px; flex-shrink: 0; }
    .btn.primary { background: var(--grad); color: #fff; box-shadow: 0 10px 26px rgba(139, 92, 246, .4); }
    .btn.primary:hover { filter: brightness(1.12); }
    .btn.ghost { background: var(--btn-ghost); color: var(--text); }
    .btn.ghost:hover { background: var(--btn-ghost-hover); }
    .btn.icon-only { flex: 0 0 46px; padding: 13px 0; }
    .hidden { display: none !important; }

    /* لینک‌ها */
    .links { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .link-row {
      display: flex; align-items: center; gap: 13px;
      background: var(--btn-ghost);
      border: 1px solid var(--line);
      border-radius: 17px; padding: 12px 15px;
      text-decoration: none; color: var(--text);
      transition: transform .2s, background .2s;
      animation: rise .5s cubic-bezier(.2, .9, .3, 1.1) both;
    }
    .link-row:hover { transform: translateY(-2px); background: var(--btn-ghost-hover); }
    .link-icon {
      width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
      display: grid; place-items: center; color: #fff;
    }
    .link-icon svg { width: 20px; height: 20px; }
    .link-row .txt { flex: 1; text-align: start; min-width: 0; }
    .link-row .txt b { display: block; font-size: 14px; font-weight: 700; }
    .link-row .txt span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; direction: ltr; }
    .link-row .arrow { color: var(--muted); flex-shrink: 0; transition: transform .2s; }
    .link-row:hover .arrow { transform: translateX(3px); }
    [dir="rtl"] .link-row:hover .arrow { transform: translateX(-3px) scaleX(-1); }
    [dir="ltr"] .arrow svg, [dir="ltr"] .link-row .arrow svg { transform: none; }
    .arrow svg { width: 17px; height: 17px; }

    footer { margin-top: 22px; color: var(--muted); font-size: 11.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    footer svg { width: 13px; height: 13px; }

    .toast {
      position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg);
      padding: 11px 22px; border-radius: 999px; font-size: 13px; font-weight: 700;
      z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,.3);
      animation: toast .3s ease both;
    }
    @keyframes toast { from { opacity: 0; transform: translate(-50%, 14px); } }
  </style>
</head>

      linkedin: ["#0a66c2", "#0e76a8"],
      telegram: ["#229ed9", "#2aabee"],
      whatsapp: ["#128c7e", "#25d366"],
      x:        ["#1a1a1a", "#3a3a3a"],
      youtube:  ["#ff0000", "#cc0000"],
      github:   ["#24292f", "#57606a"],
      mail:     ["#ea4335", "#f46054"],
      phone:    ["#10b981", "#34d399"]
    };

    // ترجمه‌ها
    const I18N = {
      fa: {
        saveContact: "ذخیره مخاطب", resume: "دانلود رزومه",
        locationPre: "", copied: "لینک کپی شد ✅", saved: "مخاطب ذخیره شد ✅",
        shareFail: "کپی نشد 😕", footer: "ساخته شده با NFC — گوشی‌ات رو نزدیک کن",
        dir: "rtl", htmlLang: "fa", nextLang: "EN"
      },
      en: {
        saveContact: "Save Contact", resume: "Download Resume",
        locationPre: "", copied: "Link copied ✅", saved: "Contact saved ✅",
        shareFail: "Couldn't copy 😕", footer: "Made with NFC — tap your phone",
        dir: "ltr", htmlLang: "en", nextLang: "فا"
      }
    };

    const $ = id => document.getElementById(id);
    const store = {
      get k() { try { return localStorage; } catch (e) { return { getItem: () => null, setItem: () => {} }; } }
    };
    let lang  = store.k.getItem("lang")  || "fa";
    let theme = store.k.getItem("theme") || "dark";
    const t = () => I18N[lang];

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      setTimeout(() => el.classList.add("hidden"), 2200);
    }

    // ─── رندر صفحه ───
    function render() {
      const tr = t();
      document.documentElement.lang = tr.htmlLang;
      document.documentElement.dir  = tr.dir;
      document.documentElement.dataset.theme = theme;

      document.title = `${CONFIG.name[lang]} | ${lang === "fa" ? "کارت ویزیت دیجیتال" : "Digital Card"}`;
      $("name").textContent = CONFIG.name[lang];
      $("title").textContent = CONFIG.title[lang];
      $("bio").textContent = CONFIG.bio[lang];
      $("location").innerHTML = `${ICONS.pin}<span>${CONFIG.location[lang]}</span>`;
      $("initials").textContent = (CONFIG.name[lang] || "?").trim().charAt(0);
      $("vcardBtn").innerHTML = `${ICONS.userPlus}<span>${tr.saveContact}</span>`;
      $("resumeBtn").innerHTML = `${ICONS.download}<span>${tr.resume}</span>`;
      $("shareBtn").innerHTML = ICONS.share;
      $("themeBtn").innerHTML = theme === "dark" ? ICONS.sun : ICONS.moon;
      $("langBtn").textContent = tr.nextLang;
      $("footer").innerHTML = `${ICONS.nfc}<span>${tr.footer}</span>`;

      // لینک‌ها
      $("links").innerHTML = CONFIG.links.map((l, i) => {
        const [c1, c2] = BRAND[l.id] || BRAND.website;
        return `<a class="link-row" href="${l.url}" target="_blank" rel="noopener" style="animation-delay:${.25 + i * .07}s">
          <span class="link-icon" style="background:linear-gradient(135deg,${c1},${c2})">${ICONS[l.id] || ICONS.website}</span>
          <span class="txt"><b>${l.label[lang]}</b><span>${l.url.replace(/^https?:\/\/(www\.)?/, "")}</span></span>
          <span class="arrow" style="transform:scaleX(${tr.dir === "rtl" ? -1 : 1})">${ICONS.chevron}</span>
        </a>`;
      }).join("");
    }

    // ─── تم ───
    $("themeBtn").onclick = () => {
      theme = theme === "dark" ? "light" : "dark";
      store.k.setItem("theme", theme);
      render();
    };

    // ─── زبان ───
    $("langBtn").onclick = () => {
      lang = lang === "fa" ? "en" : "fa";
      store.k.setItem("lang", lang);
      render();
    };

    // ─── اشتراک‌گذاری ───
    async function share() {
      const data = { title: CONFIG.name[lang], text: CONFIG.title[lang], url: location.href };
      try {
        if (navigator.share) { await navigator.share(data); return; }
        await navigator.clipboard.writeText(location.href);
        toast(t().copied);
      } catch (e) { if (e.name !== "AbortError") toast(t().shareFail); }
    }
    $("shareBtn").onclick = share;

    // ─── ذخیره مخاطب (vCard) ───
    $("vcardBtn").onclick = () => {
      const en = CONFIG.name.en.trim().split(" ");
      const vcf = [
        "BEGIN:VCARD", "VERSION:3.0",
        `N:${en.length > 1 ? en[en.length - 1] : ""};${en[0]};;;`,
        `FN:${CONFIG.name.en}`,
        `TITLE:${CONFIG.title.en}`,
        `ORG:${CONFIG.title.en}`,
        `TEL;TYPE=CELL:${CONFIG.phone}`,
        `EMAIL:${CONFIG.email}`,
        `URL:${CONFIG.website}`,
        `NOTE:${CONFIG.bio.en.replace(/\n/g, " ")}`,
        "END:VCARD"
      ].join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([vcf], { type: "text/vcard;charset=utf-8" }));
      a.download = CONFIG.name.en.replace(/\s+/g, "_") + ".vcf";
      document.body.appendChild(a); a.click(); a.remove();
      toast(t().saved);
    };

    // اگر رزومه آپلود نشده بود، دکمه‌اش مخفی میشه (فقط برای فایل‌های کنار صفحه)
    if (!/^https?:/i.test(CONFIG.resume)) {
      fetch(CONFIG.resume, { method: "HEAD" })
        .then(r => { if (!r.ok) $("resumeBtn").classList.add("hidden"); })
        .catch(() => { if (location.protocol !== "file:") $("resumeBtn").classList.add("hidden"); });
    }

    render();
  </script>
</body>
</html>
